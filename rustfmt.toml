# rustfmt configuration for Sentinel AI
# Only stable-channel options. Nightly options in rustfmt_nightly.toml

edition = "2021"
max_width = 100
tab_spaces = 4
hard_tabs = false
newline_style = "Unix"
use_small_heuristics = "Max"
chain_width = 60
match_block_trailing_comma = true
match_arm_leading_pipes = "Never"
attr_fn_like_width = 0
struct_variant_width = 0
