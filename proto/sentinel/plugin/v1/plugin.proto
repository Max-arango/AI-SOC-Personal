syntax = "proto3";

package sentinel.plugin.v1;

import "sentinel/events/v1/event.proto";
import "google/protobuf/empty.proto";
import "google/protobuf/struct.proto";


// Plugin lifecycle and communication protocol

service Plugin {
  rpc Initialize(InitializeRequest) returns (InitializeResponse);
  rpc Start(StartRequest) returns (StartResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc HealthCheck(HealthCheckRequest) returns (HealthCheckResponse);
  rpc Configure(ConfigureRequest) returns (ConfigureResponse);
  rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
  rpc ProcessEvent(ProcessEventRequest) returns (ProcessEventResponse);
  rpc ProcessEventBatch(ProcessEventBatchRequest) returns (ProcessEventBatchResponse);
  rpc ExecuteAction(ExecuteActionRequest) returns (ExecuteActionResponse);
  rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);
}

message InitializeRequest {
  string plugin_id = 1;
  map<string, string> core_info = 2;
  repeated string granted_capabilities = 3;
}
message InitializeResponse {
  bool success = 1;
  string error = 2;
  PluginManifest manifest = 3;
}

message StartRequest {}
message StartResponse { bool success = 1; string error = 2; }
message StopRequest { bool graceful = 1; }
message StopResponse { bool success = 1; string error = 2; }
message HealthCheckRequest {}
message HealthCheckResponse { bool healthy = 1; string details = 2; }

message ConfigureRequest { google.protobuf.Struct config = 1; }
message ConfigureResponse { bool success = 1; string error = 2; }
message GetConfigRequest {}
message GetConfigResponse { google.protobuf.Struct config = 1; }

message ProcessEventRequest {
  sentinel.events.v1.Event event = 1;
  PluginContext context = 2;
}
message PluginContext {
  map<string, string> config = 1;
  repeated string secrets = 2;
  map<string, string> host_info = 3;
}
message ProcessEventResponse {
  bool success = 1;
  string error = 2;
  repeated Enrichment enrichments = 3;
}
message Enrichment {
  string key = 1;
  google.protobuf.Value value = 2;
}

message ProcessEventBatchRequest {
  repeated sentinel.events.v1.Event events = 1;
  PluginContext context = 2;
}
message ProcessEventBatchResponse {
  bool success = 1;
  string error = 2;
  int32 processed_count = 3;
}

message ExecuteActionRequest {
  string action_id = 1;
  google.protobuf.Struct parameters = 2;
  sentinel.events.v1.Event triggering_event = 3;
}
message ExecuteActionResponse {
  bool success = 1;
  string result = 2;
  google.protobuf.Struct data = 3;
}

message GetMetricsRequest {}
message GetMetricsResponse {
  google.protobuf.Struct metrics = 1;
}

message PluginManifest {
  string id = 1;
  string name = 2;
  string version = 3;
  string author = 4;
  string description = 5;
  repeated string capabilities = 6;
  google.protobuf.Struct config_schema = 7;
}