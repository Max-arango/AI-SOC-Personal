[workspace]
resolver = "2"
members = [
    "crates/*",
    "apps/*",
    "collectors/*",
    "plugins/*",
]
exclude = [
    "ui/tauri-app/node_modules",
    "ui/tauri-app/src-tauri",
    "target",
    "collectors/src",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/sentinel-ai/sentinel-ai"
authors = ["Sentinel AI Team <team@sentinel-ai.dev>"]
categories = ["security", "system-tools", "monitoring"]
keywords = ["security", "edr", "siem", "monitoring", "ai"]
publish = false

[workspace.dependencies]
# Core async runtime
tokio = { version = "1.38", features = ["full", "tracing", "rt-multi-thread", "macros"] }
tracing = { version = "0.1", features = ["std"] }
tracing-subscriber = { version = "0.3", features = ["env-filter", "json", "fmt", "registry"] }
tracing-appender = "0.2"
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
config = { version = "0.14", features = ["toml"] }
notify = "6.1"
jsonschema = "0.18"
uuid = { version = "1.7", features = ["v4", "v7", "serde", "fast-rng"] }
ulid = { version = "1.1", features = [] }
chrono = { version = "0.4", features = ["serde"] }
bytes = "1.5"
arc-swap = "1.6"
parking_lot = "0.12"
crossbeam = "0.8"
dashmap = "5.5"

# gRPC/Protobuf
tonic = "0.10"
prost = "0.12"
prost-types = "0.12"
tonic-reflection = "0.10"
tonic-health = "0.10"
tonic-build = "0.10"
protoc-bin-vendored = "3"

# CEL (Rule Engine)
cel = { version = "0.14", features = ["chrono", "json"] }

# Storage
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite", "chrono", "uuid", "migrate"] }
duckdb = { version = "1", features = ["bundled"] }

# OS Abstraction
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics",
    "Win32_System_Diagnostics_Etw",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_Management_Wmi",
], target = "cfg(windows)" }
libc = { version = "0.2" }
sysinfo = "0.31"
nix = { version = "0.27" }
objc2 = { version = "0.5" }

# Crypto/Hashing
blake3 = "1.5"
sha2 = "0.10"
ring = "0.17"
age = "0.10"
secrecy = "0.8"
zeroize = "1.7"

# AI
ollama-rs = "0.3"
tokenizers = "0.15"

# Plugin System
libloading = "0.8"

# CLI
clap = { version = "4.4", features = ["derive", "env"] }

# Testing
tempfile = "3.5"
mockall = "0.12"
proptest = "1.0"
criterion = "0.5"

# Utils
once_cell = "1.19"
lazy_static = "1.4"
futures = "0.3"
indexmap = "2.0"
smallvec = "1.10"
bitflags = "2.4"
enumflags2 = "0.7"

[workspace.lints.rust]
unused_crate_dependencies = "warn"
unused_imports = "warn"
dead_code = "warn"
non_ascii_idents = "warn"

[workspace.lints.clippy]
# Lint groups: base warnings at low priority so individual overrides can win.
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
# Overrides for patterns common in our codebase.
missing_docs_in_private_items = "allow"
module_name_repetitions = "allow"
multiple_crate_versions = "allow"
wildcard_dependencies = "allow"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"

[profile.dev]
opt-level = 0
debug = true