[package]
name = "sentinel-tauri-app"
version = "0.1.0"
edition = "2021"

[build-dependencies]
tauri-build = { version = "1.5", features = [] }

[dependencies]
tauri = { version = "1.5", features = [
    "api-all",
    "global-shortcut",
    "notification",
    "devtools",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.7", features = ["v4", "serde", "fast-rng"] }
thiserror = "1.0"
tokio = { version = "1.38", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
url = "2.5"

# Core Sentinel crates (for types and utilities)
sentinel-core = { path = "../../../crates/sentinel-core" }
sentinel-events = { path = "../../../crates/sentinel-events" }
sentinel-config = { path = "../../../crates/sentinel-config" }
sentinel-storage = { path = "../../../crates/sentinel-storage" }
sentinel-event-bus = { path = "../../../crates/sentinel-event-bus" }
sentinel-rule-engine = { path = "../../../crates/sentinel-rule-engine" }