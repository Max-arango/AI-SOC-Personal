# Clippy configuration for Sentinel AI
# Valid keys: thresholds, doc-valid-idents, allowed-lint-tables, etc.
# Lint control (allow/warn/deny) is in Cargo.toml [workspace.lints.clippy]

cognitive-complexity-threshold = 30
too-many-arguments-threshold = 10
too-many-lines-threshold = 400
type-complexity-threshold = 500

absolute-paths-allowed-crates = ["sentinel_core", "sentinel_events", "sentinel_config"]
