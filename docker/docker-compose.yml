version: '3.8'

services:
  # Sentinel Core Service
  sentinel-core:
    build:
      context: ..
      dockerfile: docker/Dockerfile.dev
    container_name: sentinel-core-dev
    environment:
      - RUST_LOG=debug
      - SENTINEL_CONFIG=/config/config.toml
      - SENTINEL_SECRETS=/config/secrets.toml
    volumes:
      - ..:/workspace
      - ./config:/config
      - sentinel-data:/data
      - sentinel-logs:/var/log/sentinel
    ports:
      - "7777:7777"  # gRPC
      - "7778:7778"  # REST Gateway
      - "9090:9090"  # Prometheus metrics
    depends_on:
      - ollama
    networks:
      - sentinel-network
    command: cargo watch -x "run --bin sentinel-core-service"

  # Ollama for local AI
  ollama:
    image: ollama/ollama:latest
    container_name: sentinel-ollama-dev
    volumes:
      - ollama-data:/root/.ollama
    ports:
      - "11434:11434"
    networks:
      - sentinel-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: sentinel-prometheus-dev
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    ports:
      - "9091:9090"
    networks:
      - sentinel-network

  # Grafana for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: sentinel-grafana-dev
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
      - grafana-data:/var/lib/grafana
    ports:
      - "3001:3000"
    networks:
      - sentinel-network
    depends_on:
      - prometheus

  # Loki for logs
  loki:
    image: grafana/loki:latest
    container_name: sentinel-loki-dev
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml
      - loki-data:/loki
    ports:
      - "3100:3100"
    networks:
      - sentinel-network

  # Promtail for log shipping
  promtail:
    image: grafana/promtail:latest
    container_name: sentinel-promtail-dev
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml
      - ../logs:/var/log/sentinel
    networks:
      - sentinel-network
    depends_on:
      - loki

volumes:
  sentinel-data:
  sentinel-logs:
  ollama-data:
  prometheus-data:
  grafana-data:
  loki-data:

networks:
  sentinel-network:
    driver: bridge