rule:
  id: sigma-093d68c7-762a-42f4-9f46-95e79142571a
  version: 1
  name: Shell Execution via Nice - Linux
  description: |
    Detects the use of the "nice" utility to execute a shell. Such behavior may be associated with privilege escalation, unauthorized command execution, or to break out from restricted environments.
  author: Li Ling, Andy Parkidomo, Robert Rakowski, Blake Hartstein (Bloomberg L.P.)
  created: 2026-07-31T22:20:38.759570856+00:00
  modified: 2026-07-31T22:20:38.759570856+00:00
  enabled: true
  category: discovery
  subcategory: null
  mitre:
  - technique: '1083'
    name: Technique 1083
    tactic: Discovery
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/nice") && (event.process.command_line.contains("/bin/bash") || event.process.command_line.contains("/bin/dash") || event.process.command_line.contains("/bin/fish") || event.process.command_line.contains("/bin/sh") || event.process.command_line.contains("/bin/zsh"))))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
