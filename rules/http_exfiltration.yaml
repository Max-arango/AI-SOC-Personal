rule:
  id: "rule-059-http-exfiltration"
  version: 1
  name: "Data Exfiltration via HTTP POST"
  description: "Large HTTP POST requests to external IPs"
  author: "Sentinel Team"
  created: "2026-01-01T00:00:00Z"
  modified: "2026-01-01T00:00:00Z"
  enabled: true
  category: "exfiltration"
  subcategory: "exfiltration-over-web"
  mitre:
    - technique: "T1567.002"
      name: "Exfiltration to Cloud Storage"
      tactic: "Exfiltration"
  severity: "Error"
  risk:
    base_score: 70
    confidence: 0.75
    multipliers: []
  condition: >
    event.type == "sentinel.process.create"
    && (event.process.command_line.lowerAscii().contains("curl -T")
        || event.process.command_line.lowerAscii().contains("curl --upload-file")
        || event.process.command_line.lowerAscii().contains("scp "))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
