rule:
  id: "rule-070-cloud-credential-theft"
  version: 1
  name: "Cloud Credential Theft"
  description: "Accessing cloud service credential files"
  author: "Sentinel Team"
  created: "2026-01-01T00:00:00Z"
  modified: "2026-01-01T00:00:00Z"
  enabled: true
  category: "credential-access"
  subcategory: "unsecured-credentials"
  mitre:
    - technique: "T1552"
      name: "Unsecured Credentials"
      tactic: "Credential Access"
  severity: "Error"
  risk:
    base_score: 70
    confidence: 0.8
    multipliers: []
  condition: >
    event.type == "sentinel.process.create"
    && (event.process.command_line.lowerAscii().contains(".aws/credentials")
        || event.process.command_line.lowerAscii().contains("gcloud config")
        || event.process.command_line.lowerAscii().contains("az login")
        || event.process.command_line.lowerAscii().contains("kubectl config"))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
