rule:
  id: sigma-999c3b12-0a8c-40b6-8e13-dd7d62b75c7a
  version: 1
  name: Potentially Suspicious Named Pipe Created Via Mkfifo
  description: Detects the creation of a new named pipe using the "mkfifo" utility in a potentially suspicious location
  author: Nasreddine Bencherchali (Nextron Systems)
  created: 2026-07-31T22:20:38.757819481+00:00
  modified: 2026-07-31T22:20:38.757819481+00:00
  enabled: true
  category: general
  subcategory: null
  mitre: []
  severity: Warning
  risk:
    base_score: 55
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/mkfifo") && event.process.command_line.contains(" /tmp/")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
