rule:
  id: sigma-08f26069-6f80-474b-8d1f-d971c6fedea0
  version: 1
  name: User Has Been Deleted Via Userdel
  description: Detects execution of the "userdel" binary. Which is used to delete a user account and related files. This is sometimes abused by threat actors in order to cover their tracks
  author: Tuan Le (NCSGroup)
  created: 2026-07-31T22:20:38.781559856+00:00
  modified: 2026-07-31T22:20:38.781559856+00:00
  enabled: true
  category: ''
  subcategory: null
  mitre:
  - technique: '1531'
    name: Technique 1531
    tactic: ''
  severity: Warning
  risk:
    base_score: 55
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/userdel")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
