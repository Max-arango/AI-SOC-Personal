rule:
  id: "rule-079-lsass-dump"
  version: 1
  name: "Memory Credential Dumping"
  description: "Tools that dump credentials from process memory"
  author: "Sentinel Team"
  created: "2026-01-01T00:00:00Z"
  modified: "2026-01-01T00:00:00Z"
  enabled: true
  category: "credential-access"
  subcategory: "os-credential-dumping"
  mitre:
    - technique: "T1003.001"
      name: "LSASS Memory"
      tactic: "Credential Access"
  severity: "Critical"
  risk:
    base_score: 90
    confidence: 0.9
    multipliers: []
  condition: >
    event.type == "sentinel.process.create"
    && (event.process.command_line.lowerAscii().contains("procdump")
        || event.process.command_line.lowerAscii().contains("gcore")
        || event.process.command_line.lowerAscii().contains("mimikatz"))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
