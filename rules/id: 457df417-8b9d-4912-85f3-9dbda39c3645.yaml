  modified: 2026-07-31T22:20:38.760262518+00:00
  enabled: true
  category: general
  subcategory: null
  mitre: []
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/nohup") && event.process.command_line.contains("/tmp/")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
