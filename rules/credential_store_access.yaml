rule:
  id: "rule-050-credential-store-access"
  version: 1
  name: "Credential Store Access"
  description: "Accessing system credential stores and keyrings"
  author: "Sentinel Team"
  created: "2026-01-01T00:00:00Z"
  modified: "2026-01-01T00:00:00Z"
  enabled: true
  category: "credential-access"
  subcategory: "credentials-from-password-stores"
  mitre:
    - technique: "T1555.003"
      name: "Credentials from Web Browsers"
      tactic: "Credential Access"
  severity: "Error"
  risk:
    base_score: 70
    confidence: 0.8
    multipliers: []
  condition: >
    event.type == "sentinel.process.create"
    && (event.process.command_line.lowerAscii().contains("gnome-keyring")
        || event.process.command_line.lowerAscii().contains("kwallet")
        || event.process.command_line.lowerAscii().contains("secret-tool")
        || event.process.command_line.lowerAscii().contains("keychain"))
    && (event.process.command_line.lowerAscii().contains("dump")
        || event.process.command_line.lowerAscii().contains("export")
        || event.process.command_line.lowerAscii().contains("lookup"))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
