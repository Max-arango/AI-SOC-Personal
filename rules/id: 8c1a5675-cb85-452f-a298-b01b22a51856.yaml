    name: Technique 1059
    tactic: Execution
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create"
  and_conditions: []
  or_conditions: []
  not_conditions: []
