rule:
  id: sigma-179b3686-6271-4d87-807d-17d843a8af73
  version: 1
  name: Suspicious Filename with Embedded Base64 Commands
  description: |
    Detects files with specially crafted filenames that embed Base64-encoded bash payloads designed to execute when processed by shell scripts.
    These filenames exploit shell interpretation quirks to trigger hidden commands, a technique observed in VShell malware campaigns.
  author: '@kostastsale'
  created: 2026-07-31T22:20:38.732153052+00:00
  modified: 2026-07-31T22:20:38.732153052+00:00
  enabled: true
  category: execution
  subcategory: null
  mitre:
  - technique: '1059.004'
    name: Technique 1059.004
    tactic: Execution
  - technique: '1027'
    name: Technique 1027
    tactic: ''
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.file.modify" && (((event.process.path.contains("{echo") || event.process.path.contains("{base64,-d}"))))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
