rule:
  id: "rule-072-etc-hosts-modification"
  version: 1
  name: "Hosts File Modification"
  description: "Modifying /etc/hosts for DNS hijacking"
  author: "Sentinel Team"
  created: "2026-01-01T00:00:00Z"
  modified: "2026-01-01T00:00:00Z"
  enabled: true
  category: "impact"
  subcategory: "endpoint-denial-of-service"
  mitre:
    - technique: "T1498.001"
      name: "Direct Network Flood"
      tactic: "Impact"
  severity: "Notice"
  risk:
    base_score: 40
    confidence: 0.7
    multipliers: []
  condition: >
    event.type == "sentinel.process.create"
    && (event.process.command_line.lowerAscii().contains("/etc/hosts")
        && (event.process.command_line.lowerAscii().contains("echo")
        || event.process.command_line.lowerAscii().contains("tee")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
