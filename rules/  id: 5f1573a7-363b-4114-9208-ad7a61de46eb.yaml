rule:
  id: sigma-5f1573a7-363b-4114-9208-ad7a61de46eb
  version: 1
  name: ESXi VM List Discovery Via ESXCLI
  description: Detects execution of the "esxcli" command with the "vm" flag in order to retrieve information about the installed VMs.
  author: Cedric Maurugeon
  created: 2026-07-31T22:20:38.751479854+00:00
  modified: 2026-07-31T22:20:38.751479854+00:00
  enabled: true
  category: ''
  subcategory: null
  mitre:
  - technique: '1033'
    name: Technique 1033
    tactic: ''
  - technique: '1007'
    name: Technique 1007
    tactic: ''
  - technique: '1059.012'
    name: Technique 1059.012
    tactic: Execution
  severity: Warning
  risk:
    base_score: 55
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/esxcli") && event.process.command_line.contains("vm process") && event.process.command_line.contains(" list")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
