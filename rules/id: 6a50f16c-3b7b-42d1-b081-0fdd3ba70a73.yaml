rule:
  id: sigma-6a50f16c-3b7b-42d1-b081-0fdd3ba70a73
  version: 1
  name: User Added To Root/Sudoers Group Using Usermod
  description: Detects usage of the "usermod" binary to add users add users to the root or suoders groups
  author: TuanLe (GTSC)
  created: 2026-07-31T22:20:38.781818639+00:00
  modified: 2026-07-31T22:20:38.781818639+00:00
  enabled: true
  category: general
  subcategory: null
  mitre: []
  severity: Warning
  risk:
    base_score: 55
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/usermod") && (event.process.command_line.contains("-aG root") || event.process.command_line.contains("-aG sudoers"))))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
