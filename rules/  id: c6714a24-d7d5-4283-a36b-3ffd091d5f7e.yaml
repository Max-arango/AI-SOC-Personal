rule:
  id: sigma-c6714a24-d7d5-4283-a36b-3ffd091d5f7e
  version: 1
  name: Potential PHP Reverse Shell
  description: |
    Detects usage of the PHP CLI with the "-r" flag which allows it to run inline PHP code. The rule looks for calls to the "fsockopen" function which allows the creation of sockets.
    Attackers often leverage this in combination with functions such as "exec" or "fopen" to initiate a reverse shell connection.
  author: '@d4ns4n_'
  created: 2026-07-31T22:20:38.761660281+00:00
  modified: 2026-07-31T22:20:38.761660281+00:00
  enabled: true
  category: general
  subcategory: null
  mitre: []
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/php") && (event.process.command_line.contains(" -r ") || event.process.command_line.contains("fsockopen")) && (event.process.command_line.contains("ash") || event.process.command_line.contains("bash") || event.process.command_line.contains("bsh") || event.process.command_line.contains("csh") || event.process.command_line.contains("ksh") || event.process.command_line.contains("pdksh") || event.process.command_line.contains("sh") || event.process.command_line.contains("tcsh") || event.process.command_line.contains("zsh"))))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
