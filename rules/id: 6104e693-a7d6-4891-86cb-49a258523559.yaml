rule:
  id: sigma-6104e693-a7d6-4891-86cb-49a258523559
  version: 1
  name: Bash Interactive Shell
  description: Detects execution of the bash shell with the interactive flag "-i".
  author: '@d4ns4n_'
  created: 2026-07-31T22:20:38.737514602+00:00
  modified: 2026-07-31T22:20:38.737514602+00:00
  enabled: true
  category: general
  subcategory: null
  mitre: []
  severity: Notice
  risk:
    base_score: 35
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/bash") && event.process.command_line.contains(" -i ")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
