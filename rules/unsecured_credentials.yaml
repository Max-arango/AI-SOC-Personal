rule:
  id: "rule-041-unsecured-credentials"
  version: 1
  name: "Access to Unsecured Credentials"
  description: "Reading credential files or environment files"
  author: "Sentinel Team"
  created: "2026-01-01T00:00:00Z"
  modified: "2026-01-01T00:00:00Z"
  enabled: true
  category: "credential-access"
  subcategory: "unsecured-credentials"
  mitre:
    - technique: "T1552.001"
      name: "Credentials In Files"
      tactic: "Credential Access"
  severity: "Error"
  risk:
    base_score: 75
    confidence: 0.85
    multipliers: []
  condition: >
    event.type == "sentinel.process.create"
    && (event.process.command_line.lowerAscii().contains("cat .env")
        || event.process.command_line.lowerAscii().contains("cat .git/config")
        || event.process.command_line.lowerAscii().contains(".aws/credentials")
        || event.process.command_line.lowerAscii().contains("id_rsa"))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
