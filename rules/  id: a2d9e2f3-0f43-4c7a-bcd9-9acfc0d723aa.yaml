    name: Technique 1059.004
    tactic: Execution
  - technique: '1203'
    name: Technique 1203
    tactic: Execution
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create"
