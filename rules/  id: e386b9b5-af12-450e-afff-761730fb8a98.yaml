rule:
  id: sigma-e386b9b5-af12-450e-afff-761730fb8a98
  version: 1
  name: AWS VPC Flow Logs Deleted
  description: |
    Detects the deletion of one or more VPC Flow Logs in AWS Elastic Compute Cloud (EC2) through the DeleteFlowLogs API call.
    Adversaries may delete flow logs to evade detection or remove evidence of network activity, hindering forensic investigations and visibility into malicious operations.
  author: Ivan Saakov
  created: 2026-07-31T22:31:34.302016179+00:00
  modified: 2026-07-31T22:31:34.302016179+00:00
  enabled: true
  category: general
  subcategory: null
  mitre: []
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create"
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
