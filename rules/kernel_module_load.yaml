rule:
  id: "rule-056-kernel-module-load"
  version: 1
  name: "Kernel Module Load"
  description: "Loading or unloading kernel modules"
  author: "Sentinel Team"
  created: "2026-01-01T00:00:00Z"
  modified: "2026-01-01T00:00:00Z"
  enabled: true
  category: "privilege-escalation"
  subcategory: "rootkit"
  mitre:
    - technique: "T1547.006"
      name: "Kernel Modules and Extensions"
      tactic: "Persistence"
  severity: "Critical"
  risk:
    base_score: 90
    confidence: 0.9
    multipliers: []
  condition: >
    event.type == "sentinel.process.create"
    && (event.process.command_line.lowerAscii().contains("insmod")
        || event.process.command_line.lowerAscii().contains("modprobe")
        || event.process.command_line.lowerAscii().contains("rmmod"))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
