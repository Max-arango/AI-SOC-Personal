rule:
  id: sigma-4cad6c64-d6df-42d6-8dae-eb78defdc415
  version: 1
  name: Potential Linux Process Code Injection Via DD Utility
  description: Detects the injection of code by overwriting the memory map of a Linux process using the "dd" Linux command.
  author: Joseph Kamau
  created: 2026-07-31T22:20:38.746859751+00:00
  modified: 2026-07-31T22:20:38.746859751+00:00
  enabled: true
  category: defense-evasion
  subcategory: null
  mitre:
  - technique: '1055.009'
    name: Technique 1055.009
    tactic: Defense Evasion
  severity: Warning
  risk:
    base_score: 55
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/dd") && (event.process.command_line.contains("of=") || event.process.command_line.contains("/proc/") || event.process.command_line.contains("/mem"))))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
