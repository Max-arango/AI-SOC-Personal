rule:
  id: sigma-e34cfa0c-0a50-4210-9cb3-5632d08eb041
  version: 1
  name: Potential GobRAT File Discovery Via Grep
  description: Detects the use of grep to discover specific files created by the GobRAT malware
  author: Joseliyo Sanchez, @Joseliyo_Jstnk
  created: 2026-07-31T22:20:38.756984378+00:00
  modified: 2026-07-31T22:20:38.756984378+00:00
  enabled: true
  category: discovery
  subcategory: null
  mitre:
  - technique: '1082'
    name: Technique 1082
    tactic: Discovery
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/grep") && (event.process.command_line.contains("apached") || event.process.command_line.contains("frpc") || event.process.command_line.contains("sshd.sh") || event.process.command_line.contains("zone.arm"))))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
