rule:
  id: sigma-d8d97d51-122d-4cdd-9e2f-01b4b4933530
  version: 1
  name: Capabilities Discovery - Linux
  description: Detects usage of "getcap" binary. This is often used during recon activity to determine potential binaries that can be abused as GTFOBins or other.
  author: Nasreddine Bencherchali (Nextron Systems)
  created: 2026-07-31T22:20:38.739095410+00:00
  modified: 2026-07-31T22:20:38.739095410+00:00
  enabled: true
  category: discovery
  subcategory: null
  mitre:
  - technique: '1083'
    name: Technique 1083
    tactic: Discovery
  severity: Notice
  risk:
    base_score: 35
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/getcap") && event.process.command_line.contains(" -r ")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
