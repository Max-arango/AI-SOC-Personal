rule:
  id: sigma-ddb26b76-4447-4807-871f-1b035b2bfa5d
  version: 1
  name: Persistence Via Sudoers.d Files
  description: |
    Detects the creation or modification of files within the "sudoers.d" directory on Linux systems.
    Such activity may indicate an attempt to establish or maintain privilege escalation by granting specific users elevated permissions.
    Unauthorized changes to sudoers files are a common technique used by attackers to persist administrative access.
  author: Nasreddine Bencherchali (Nextron Systems)
  created: 2026-07-31T22:20:38.731331400+00:00
  modified: 2026-07-31T22:20:38.731331400+00:00
  enabled: true
  category: privilege-escalation
  subcategory: null
  mitre:
  - technique: '1548.003'
    name: Technique 1548.003
    tactic: Privilege Escalation
  severity: Warning
  risk:
    base_score: 55
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.file.modify" && ((event.process.path.contains("/etc/sudoers.d/")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
