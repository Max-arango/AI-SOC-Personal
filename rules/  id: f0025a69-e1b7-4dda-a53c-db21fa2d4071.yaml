rule:
  id: sigma-f0025a69-e1b7-4dda-a53c-db21fa2d4071
  version: 1
  name: Script Interpreter Spawning Credential Scanner - Linux
  description: |
    Detects a script interpreter process (like node.js or bun) spawning a known credential scanning tool (e.g., trufflehog, gitleaks).
    This behavior is indicative of an attempt to find and steal secrets, as seen in the "Shai-Hulud: The Second Coming" campaign.
  author: Swachchhanda Shrawan Poudel (Nextron Systems)
  created: 2026-07-31T22:20:38.778259326+00:00
  modified: 2026-07-31T22:20:38.778259326+00:00
  enabled: true
  category: credential-access
  subcategory: null
  mitre:
  - technique: '1552'
    name: Technique 1552
    tactic: Credential Access
  - technique: '1005'
    name: Technique 1005
    tactic: ''
  - technique: '1059.004'
    name: Technique 1059.004
    tactic: Execution
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create"
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
