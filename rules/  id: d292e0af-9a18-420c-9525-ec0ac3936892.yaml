rule:
  id: sigma-d292e0af-9a18-420c-9525-ec0ac3936892
  version: 1
  name: Suspicious Java Children Processes
  description: Detects java process spawning suspicious children
  author: Nasreddine Bencherchali (Nextron Systems)
  created: 2026-07-31T22:20:38.776558871+00:00
  modified: 2026-07-31T22:20:38.776558871+00:00
  enabled: true
  category: execution
  subcategory: null
  mitre:
  - technique: '1059'
    name: Technique 1059
    tactic: Execution
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/java") && (event.process.command_line.contains("/bin/sh") || event.process.command_line.contains("bash") || event.process.command_line.contains("dash") || event.process.command_line.contains("ksh") || event.process.command_line.contains("zsh") || event.process.command_line.contains("csh") || event.process.command_line.contains("fish") || event.process.command_line.contains("curl") || event.process.command_line.contains("wget") || event.process.command_line.contains("python"))))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
