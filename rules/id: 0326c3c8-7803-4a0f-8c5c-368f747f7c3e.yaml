rule:
  id: sigma-0326c3c8-7803-4a0f-8c5c-368f747f7c3e
  version: 1
  name: Triple Cross eBPF Rootkit Execve Hijack
  description: Detects execution of a the file "execve_hijack" which is used by the Triple Cross rootkit as a way to elevate privileges
  author: Nasreddine Bencherchali (Nextron Systems)
  created: 2026-07-31T22:20:38.781031222+00:00
  modified: 2026-07-31T22:20:38.781031222+00:00
  enabled: true
  category: general
  subcategory: null
  mitre: []
  severity: Error
  risk:
    base_score: 75
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && ((event.process.name.contains("/sudo") && event.process.command_line.contains("execve_hijack")))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
