rule:
  id: sigma-7692f583-bd30-4008-8615-75dab3f08a99
  version: 1
  name: Enable BPF Kprobes Tracing
  description: Detects common command used to enable bpf kprobes tracing
  author: Nasreddine Bencherchali (Nextron Systems)
  created: 2026-07-31T22:20:38.737777277+00:00
  modified: 2026-07-31T22:20:38.737777277+00:00
  enabled: true
  category: general
  subcategory: null
  mitre: []
  severity: Warning
  risk:
    base_score: 55
    confidence: 0.8
    multipliers: []
  condition: event.type == "sentinel.process.create" && (((event.process.command_line.contains("echo 1 >") || event.process.command_line.contains("/sys/kernel/debug/tracing/events/kprobes/")) && (event.process.command_line.contains("/myprobe/enable") || event.process.command_line.contains("/myretprobe/enable"))))
  and_conditions: []
  or_conditions: []
  not_conditions: []
  actions: []
  suppressions: []
  tests: []
