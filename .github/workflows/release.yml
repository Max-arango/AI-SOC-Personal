name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build release binaries
        run: cargo build --release --workspace

      - name: Package artifacts
        run: |
          mkdir -p dist
          cp target/release/sentinel-core-service dist/
          cp target/release/sentinel-cli dist/
          cp docker/docker-compose.yml dist/
          cp docker/sentinel.toml dist/config.toml.example
          cp README.md dist/
          tar czf "sentinel-ai-${{ github.ref_name }}-linux-x86_64.tar.gz" -C dist .
          sha256sum "sentinel-ai-${{ github.ref_name }}-linux-x86_64.tar.gz" > "sentinel-ai-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sentinel-ai-${{ github.ref_name }}-linux
          path: |
            sentinel-ai-${{ github.ref_name }}-linux-x86_64.tar.gz
            sentinel-ai-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256

  docker:
    name: Docker Image
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker image
        run: docker build -f docker/Dockerfile.prod -t sentinel-ai:${{ github.ref_name }} .
      - name: Save Docker image
        run: docker save sentinel-ai:${{ github.ref_name }} | gzip > sentinel-ai-${{ github.ref_name }}-docker.tar.gz

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [build, docker]
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: sentinel-ai-${{ github.ref_name }}-linux

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sentinel AI ${{ github.ref_name }}"
          body: |
            ## Sentinel AI ${{ github.ref_name }}

            ### What's new
            - See CHANGELOG for details

            ### Downloads
            - `sentinel-ai-${{ github.ref_name }}-linux-x86_64.tar.gz` — Linux binary
            - `sentinel-ai-${{ github.ref_name }}-docker.tar.gz` — Docker image
          files: |
            sentinel-ai-${{ github.ref_name }}-linux-x86_64.tar.gz
            sentinel-ai-${{ github.ref_name }}-linux-x86_64.tar.gz.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
